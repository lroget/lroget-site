titulo: Workshops and training in Misiones
fecha: 20–24 Apr 2026
resumen: "Four trainings in five days: INTA San Pedro, two secondary schools and park ranger students. The time left over went to the forest."
cuerpo: |
  Four trainings in five days, from 20 to 24 April 2026.

  - INTA San Pedro staff.
  - Tobuna secondary school.
  - Cruce Caballero secondary school.
  - Park ranger students at Universidad Nacional de Misiones.

  The time left over went to Cruce Caballero Park.
