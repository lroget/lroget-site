titulo: Fundación Vida Silvestre Argentina | Yurumí 2022
fecha: 15 Sep 2022
resumen: 'Since the first edition of Yurumí I took part in producing the event, but this time I was a speaker on a panel: "Safaris and citizen participation", which I had the honor of sharing with Raúl Chiesa. We talked about the experience of Vida Silvestre’s Safaris in their original format and the spiritual succession we sought to continue today through citizen science.'
