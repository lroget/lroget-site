titulo: Fundación Parques | Safari at Campo de Mayo
fecha: 5 Aug 2023
resumen: Following the signing of a collaboration agreement with the National Parks Administration, we organized, together with Fundación Parques, the Winter Safari at the Campo de Mayo Defense Urban Reserve. This was a very interesting project because we built it with Raúl Chiesa, also a member of COA Carancho, which allowed us to draw on experience from the seasonal censuses.
