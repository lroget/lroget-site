titulo: "El nombrador: interview with Ferdinando Boero. Revista Vida Silvestre no. 131."
fecha: 5 Aug 2015
resumen: "Ferdinando Boero is a marine biologist, notable among other things for two cnidarians: Phialella zappai, which he described and named after Frank Zappa (who returned the favor by dedicating an adaptation of a song to him, Lonesome Cowboy Nando; that is how I came to know him), and Turritopsis, the jellyfish that apparently could achieve immortality, which he studied. I had the pleasure of interviewing him for Revista Vida Silvestre."
