titulo: "El nombrador: interview with Ferdinando Boero. Revista Vida Silvestre no. 131."
fecha: 5 Aug 2015
resumen: "Ferdinando Boero is a marine biologist notable for describing two cnidarians: 1. Phialella zappai, named after Frank Zappa, who in turn returned the favor by dedicating an adaptation of a song to him: Lonesome cowboy Nando (that is how I came to know him); 2. Turritella nutricula, a species of jellyfish that apparently could achieve immortality. I had the pleasure of interviewing him for Revista Vida Silvestre. Published in no. 131."
