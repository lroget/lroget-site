titulo: Training | INTA San Pedro
fecha: 21 Apr 2026
resumen: I gave a training session for the staff of INTA (Instituto Nacional de Tecnología Agropecuaria, Argentina's national agricultural technology institute) in San Pedro, Misiones.
cuerpo: |
  After a good while away from Misiones, I went back to the province to give a series of trainings. The first was for technical staff of INTA in San Pedro, at the office of Proyecto Restaura, a Vida Silvestre project, where they welcomed me with milanesas (breaded cutlets). I also took the chance to record some of Misiones's diversity along the road, where roadkill is unfortunately a common problem. That is how I recorded an aguará popé (*Procyon cancrivorus*), the South American raccoon, dead on the road.
