titulo: "Sustainable mobility stand | Vicente López: Escuelas Sustentables"
fecha: 12 Nov 2026
resumen: I designed the pedagogical proposal for a stand on sustainable mobility and climate change, produced the materials and ran the stand at the closing of Vicente López's Escuelas Sustentables (Sustainable Schools) program.
cuerpo: |
  I was invited to design a proposal for the sustainable mobility and climate change stand at the closing event of Vicente López's Escuelas Sustentables (Sustainable Schools) program. The event took place on Thursday, 12 November, from 9 a.m. to 12 p.m., at the Dr. Arturo Frondizi Convention Center.

  The pedagogical proposal was developed from a review of the program's documents and manuals, to learn the approach the municipality proposes on these topics, and five key messages were selected from it. For students from 6th grade of primary school to 5th year of secondary school, interaction took priority over lecturing: a dynamic of questions and objects to handle, in which the kids reasoned through each answer before receiving the explanation.

  The work was comprehensive: besides defining the proposal, I was in charge of producing the materials and running the stand during the event. The materials were a street model of 100 x 70 cm, with a toy bus and two toy cars that could be moved to reveal information about each means of transport, and a poster of 84 x 120 cm with six infographics.
epigrafes:
  - The street model with the toy bus and cars, at the event
  - The car spaces, with CO2 labels by number of passengers
