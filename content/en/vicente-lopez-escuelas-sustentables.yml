titulo: "Sustainable mobility stand | Vicente López: Escuelas Sustentables"
fecha: 12 Nov 2026
resumen: I designed the pedagogical proposal for a stand on sustainable mobility and climate change based on the municipality's approach, produced the materials and ran the stand at the closing of Vicente López's Escuelas Sustentables (Sustainable Schools) program.
cuerpo: |
  I was invited to design a proposal for the sustainable mobility and climate change stand at the closing event of Vicente López's Escuelas Sustentables (Sustainable Schools) program. The event took place on Thursday, 12 November, from 9 a.m. to 12 p.m., at the Dr. Arturo Frondizi Convention Center.

  Before designing, I reviewed the program's documents and manuals to learn the approach the municipality proposes on these topics, and I took the context into account: an event with one stand per theme, and an audience of students from 6th grade of primary school to 5th year of secondary school who were already working on environmental topics in class. Five key messages came out of that:

  1. There are different ways to get around the city. The car emits the most and, the fewer people in it, the worse.
  2. The bus is more efficient because its emissions are shared among many people.
  3. Cycling and walking are also options and, whenever possible, the healthiest ones.
  4. Each means of transport also has a different footprint in noise and urban space.
  5. A question to take home: which city we live in today and which one we would like to live in in the future.

  The challenge was to hold the attention of that audience, so the approach was participatory rather than expository: a dynamic of questions and objects to handle, in which the kids reasoned through each answer before receiving the explanation. They were asked how many people fit in a car and how many in a bus, whether the cars seen on an avenue usually carry four or five people or one or two, and which of the two has more impact on the environment. The students answered, we reasoned together, and they were invited to comment, share their experience or ask questions. The infographics served as visual support to explain the concepts afterwards.

  The work was comprehensive: I defined the proposal, produced the materials and ran the stand during the event. The materials were a street model of 100 x 70 cm, with three labeled lanes (bicycles, bus and cars), a toy bus and two toy cars that could be moved to reveal information about each means of transport, and a poster of 84 x 120 cm with six infographics: what climate change is, the carbon footprint, noise in the city, the space each vehicle takes up, questions to look at one's own neighborhood, and concrete actions. The poster closes with another question to take home: what small change in the daily trip to school could start tomorrow.

  No attendance record was kept, so there are no participation figures.
