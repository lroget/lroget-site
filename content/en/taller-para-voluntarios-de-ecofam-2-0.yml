titulo: Aves Argentinas | Workshop for EcoFam 2.0 volunteers
fecha: 22 Feb 2025
resumen: "Aves Argentinas administers eBird in Argentina, but it also runs a citizen science project that uses iNaturalist: EcoFAM 2.0. The project invited me to give a talk and workshop in Arenas Verdes, Necochea, for the project's volunteers, who record dead birds, reptiles and mammals on the Buenos Aires coast."
