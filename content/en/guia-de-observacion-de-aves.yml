titulo: BirdingPal | Birdwatching guide
fecha: Jan 2012 – Dec 2016
resumen: "My first steps in testing my knowledge were as a volunteer guide for birdwatchers from elsewhere visiting Buenos Aires. It was a great formative experience: that is how I guided birders and scientists from South Africa, Australia, Denmark, the USA, Italy and Canada, among others."
