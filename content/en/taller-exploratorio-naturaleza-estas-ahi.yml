titulo: Centro Cultural de la Ciencia (C3) | Workshop "Exploratorio Naturaleza, ¿Estás ahí?"
fecha: 22 Apr 2023
resumen: During Citizen Science Month, I was invited to give workshops at the Centro Cultural de la Ciencia. In the morning, I gave a training session for the “copilotos”, the institution’s educational guides. In the afternoon, I coordinated an activity open to the public.
