titulo: Reserva de Toyota | Jornada de capacitación para docentes
fecha: 16 oct 2024
resumen: En el marco de un trabajo entre Vida Silvestre y Toyota, di una capacitación para 41 docentes de 36 instituciones educativas, en la reserva natural que la empresa tiene en su fábrica en Zárate, Buenos Aires.
