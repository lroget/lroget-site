titulo: Aves Argentinas | Taller para voluntarios de EcoFam 2.0
fecha: 22 feb 2025
resumen: "Aves Argentinas administra eBird en Argentina, pero también tiene un proyecto de ciencia ciudadana que utiliza iNaturalist: EcoFAM 2.0. Desde el proyecto me invitaron a dar una presentación y taller en Arenas Verdes, Necochea, para los voluntarios del proyecto, que registran aves, reptiles y mamíferos muertos en la costa bonaerense."
