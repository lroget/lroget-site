titulo: "Capacitación | INTA San Pedro"
fecha: 21 abr 2026
resumen: "Di una capacitación al personal del INTA (Instituto Nacional de Tecnología Agropecuaria) de San Pedro, Misiones."
cuerpo: |
  Después de un buen tiempo fuera de Misiones, volví a la provincia para dar una serie de capacitaciones. La primera fue para personal técnico del INTA de San Pedro, en la oficina del Proyecto Restaura, de Vida Silvestre, donde me recibieron con milanesas. Además, aproveché para registrar algo de la diversidad misionera en la ruta, donde lamentablemente los atropellamientos suelen ser un problema. Así pude registrar un aguará popé (*Procyon cancrivorus*), el mapache sudamericano, muerto en la ruta.
