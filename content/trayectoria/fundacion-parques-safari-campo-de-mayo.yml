titulo: Fundación Parques | Safari en Campo de Mayo
fecha: 5 ago 2023
resumen: A raíz de la firma de un convenio de colaboración con la Administración de Parques Nacionales, organizamos junto a la Fundación Parques el Safari de Invierno en la Reserva Urbana de la Defensa Campo de Mayo. Este fue un proyecto muy interesante ya que lo armamos con Raúl Chiesa, también integrante del COA Carancho, lo que permitió tomar experiencias de los censos estacionales.
