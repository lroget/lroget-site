titulo: "Stand de movilidad sustentable | Vicente López: Escuelas Sustentables"
fecha: 12 nov 2026
resumen: Diseñé la propuesta pedagógica de un stand sobre movilidad sustentable y cambio climático a partir del enfoque del municipio, produje los materiales y atendí el stand en el cierre del programa Escuelas Sustentables de Vicente López.
cuerpo: |
  Fui convocado a diseñar una propuesta para el stand de movilidad sustentable y cambio climático en el evento de cierre del programa Escuelas Sustentables de Vicente López. El evento se realizó el jueves 12 de noviembre, de 9 a 12, en el Centro de Convenciones Dr. Arturo Frondizi.

  Antes de diseñar, revisé los documentos y manuales del programa para conocer el enfoque que propone el municipio sobre estas temáticas, y tuve en cuenta el contexto: un evento con un stand por eje temático y un público de estudiantes de 6.º grado a 5.º año que ya venían trabajando temas ambientales desde el aula. De ahí salieron cinco mensajes clave:

  1. Hay distintas opciones para moverse en la ciudad. El auto es la que más emisiones genera y, cuantas menos personas lo ocupan, peor.
  2. El colectivo es más eficiente porque sus emisiones se reparten entre muchas personas.
  3. La bicicleta y caminar también son opciones y, siempre que se pueda, las más saludables.
  4. Cada modo de transporte tiene además una huella distinta en ruido y en espacio urbano.
  5. Una pregunta para llevarse: en qué ciudad habitamos hoy y en cuál nos gustaría habitar en el futuro.

  El desafío era captar la atención de ese público, así que el enfoque fue participativo y no expositivo: una dinámica de preguntas y objetos para manipular, en la que los chicos razonaban cada respuesta antes de recibir la explicación. Se les preguntaba cuántas personas entran en un auto y cuántas en un colectivo, si los autos que se ven en una avenida suelen ir con cuatro o cinco personas o con una o dos, y cuál de los dos tiene más impacto en el ambiente. Los alumnos respondían, se razonaba en conjunto y se los invitaba a comentar, contar su experiencia o hacer preguntas. Las infografías eran el apoyo visual para explicar los conceptos después.

  El trabajo fue integral: definí la propuesta, produje los materiales y atendí el stand durante el evento. Los materiales fueron una maqueta de calle de 100 x 70 cm, con tres carriles rotulados (bicicletas, colectivo y autos), un colectivo y dos autos de juguete que se podían desplazar para revelar información sobre cada medio de transporte, y un afiche de 84 x 120 cm con seis infografías: qué es el cambio climático, la huella de carbono, el ruido en la ciudad, el espacio que ocupa cada vehículo, preguntas para mirar el propio barrio y acciones concretas. El afiche cierra con otra pregunta para llevarse: qué pequeño cambio en el viaje diario a la escuela podría empezar a aplicarse desde mañana.

  No se llevó un registro de asistentes, por lo que no hay cifras de participación.
