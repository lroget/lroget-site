titulo: "Stand de movilidad sustentable | Vicente López: Escuelas Sustentables"
fecha: 12 nov 2026
resumen: Diseñé la propuesta pedagógica de un stand sobre movilidad sustentable y cambio climático, produje los materiales y atendí el stand en el cierre del programa Escuelas Sustentables de Vicente López.
cuerpo: |
  Fui convocado a diseñar una propuesta para el stand de movilidad sustentable y cambio climático en el evento de cierre del programa Escuelas Sustentables de Vicente López. El evento se realizó el jueves 12 de noviembre, de 9 a 12, en el Centro de Convenciones Dr. Arturo Frondizi.

  La propuesta pedagógica se elaboró a partir de la revisión de los documentos y manuales del programa, para conocer el enfoque que propone el municipio sobre estas temáticas, y de ella se seleccionaron cinco mensajes clave. Para estudiantes de 6.º grado a 5.º año, se priorizó la interacción antes que la exposición: una dinámica de preguntas y objetos para manipular, en la que los chicos razonaban cada respuesta antes de recibir la explicación.

  El trabajo fue integral: además de definir la propuesta, estuvo a mi cargo la producción de los materiales y la atención del stand durante el evento. Los materiales fueron una maqueta de calle de 100 x 70 cm, con un colectivo y dos autos de juguete que se podían desplazar para revelar información sobre cada medio de transporte, y un afiche de 84 x 120 cm con seis infografías.
