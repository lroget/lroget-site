fecha_orden: 2026-04-20
tipo: taller
titulo: Talleres y capacitaciones en Misiones
fecha: 20–24 abr 2026
resumen: "La dificultad de dar cuatro capacitaciones en cinco días en uno de los lugares más biodiversos del país: INTA San Pedro, dos secundarias y estudiantes de guardaparques."
cuerpo: |
  Cuatro capacitaciones en cinco días, del 20 al 24 de abril de 2026.

  - Personal del INTA San Pedro.
  - Escuela secundaria de Tobuna.
  - Escuela secundaria de Cruce Caballero.
  - Estudiantes de guardaparques de la Universidad Nacional de Misiones.
