resumen: "Cuatro capacitaciones en cinco días: INTA San Pedro, dos secundarias y estudiantes de guardaparques. El tiempo que sobró fue para el monte."
cuerpo: |
  Cuatro capacitaciones en cinco días, del 20 al 24 de abril de 2026.

  - Personal del INTA San Pedro.
  - Escuela secundaria de Tobuna.
  - Escuela secundaria de Cruce Caballero.
  - Estudiantes de guardaparques de la Universidad Nacional de Misiones.

  El tiempo que sobró fue para el Parque Cruce Caballero.
