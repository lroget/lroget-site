titulo: "El nombrador: entrevista a Ferdinando Boero. Revista Vida Silvestre n.º 131."
fecha: 5 ago 2015
resumen: "Ferdinando Boero es un biólogo marino, notable entre otras cosas por dos cnidarios: Phialella zappai, que describió y dedicó a Frank Zappa (quien le devolvió el favor dedicándole una adaptación de una canción, Lonesome Cowboy Nando; así lo conocí), y Turritopsis, la medusa que aparentemente podría lograr la inmortalidad, que estudió. Tuve la dicha de entrevistarlo para la Revista Vida Silvestre."
