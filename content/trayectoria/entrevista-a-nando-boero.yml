titulo: "El nombrador: entrevista a Ferdinando Boero. Revista Vida Silvestre n.º 131."
fecha: 5 ago 2015
resumen: "Ferdinando Boero es un biólogo marino que es notable por describir dos cnidarios: 1. Phialella zappai, dedicada a Frank Zappa, quien a su vez le devolvió el favor dedicándole una adaptación de una canción: Lonesome cowboy Nando (así lo conocí); 2. Turritella nutricula, una especie de medusa que aparentemente podría lograr la inmortalidad. Tuve la dicha de entrevistarlo para la Revista Vida Silvestre. Publicado en el n.º 131."
