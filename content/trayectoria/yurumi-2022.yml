titulo: Fundación Vida Silvestre Argentina | Yurumí 2022
fecha: 15 sep 2022
resumen: "Desde la primera edición de Yurumí participé en la producción del evento, pero esta ocasión me tocó ser orador en un panel: «Safaris y participación ciudadana», que tuve el honor de compartir con Raúl Chiesa. Hablamos de la experiencia de los Safaris de Vida Silvestre en su formato original, y la sucesión espiritual que buscábamos continuar en la actualidad mediante la ciencia ciudadana."
