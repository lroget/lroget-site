backend:
  name: github
  repo: lroget/lroget-site
  branch: __BRANCH__
  commit_messages:
    create: "Panel: nueva entrada {{slug}}"
    update: "Panel: edición de {{slug}}"
    delete: "Panel: borrado de {{slug}}"
    uploadMedia: "Panel: foto {{path}}"
    deleteMedia: "Panel: foto borrada {{path}}"
media_folder: public/img/entradas
public_folder: /img/entradas
collections:
  - name: trayectoria
    label: Línea de tiempo
    label_singular: Entrada
    folder: content/trayectoria
    extension: yml
    format: yaml
    create: true
    delete: true
    identifier_field: titulo
    slug: "{{slug}}"
    summary: "{{fecha}} · {{titulo}}"
    sortable_fields: [fecha_orden, titulo]
    fields:
      - {label: "Título", name: titulo, widget: string, hint: "Institución primero: Municipio de Tigre | Convenio"}
      - {label: "Fecha que se muestra", name: fecha, widget: string, hint: "Como se lee en el sitio: 20–24 abr 2026"}
      - {label: "Fecha para ordenar", name: fecha_orden, widget: datetime, time_format: false, format: "YYYY-MM-DD", hint: "Define el año y la posición en la línea de tiempo"}
      - label: "Tipo"
        name: tipo
        widget: select
        options:
          - {label: Charla, value: charla}
          - {label: Taller, value: taller}
          - {label: Congreso, value: congreso}
          - {label: Convenio, value: convenio}
          - {label: Reconocimiento, value: reco}
          - {label: Prensa, value: prensa}
          - {label: Publicación, value: pub}
          - {label: Hito, value: hito}
          - {label: Voluntariado, value: voluntariado}
      - {label: "Resumen", name: resumen, widget: text, hint: "Nunca FVSA: en público es Vida Silvestre."}
      - {label: "Enlace (dirección)", name: enlace_url, widget: string, required: false}
      - {label: "Enlace (texto)", name: enlace_texto, widget: string, required: false}
      - {label: "Texto de la página", name: cuerpo, widget: markdown, required: false, hint: "Si tiene texto o fotos, la entrada tiene página propia."}
      - label: "Fotos"
        name: fotos
        widget: list
        required: false
        hint: "Sin rostros de menores."
        fields:
          - {label: "Foto", name: imagen, widget: image}
          - {label: "Epígrafe", name: epigrafe, widget: string, required: false}
